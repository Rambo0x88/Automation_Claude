[pytest]
addopts =
    -v
    --tb=short
    --strict-markers
    --browser=chromium
    --tracing=off
    --self-contained-html
    --output=test-results/playwright
    -n0
# HTML report is auto-generated per test run with timestamp in test-results/reports/

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Smoke tests (quick validation)
    regression: Regression tests (full suite)
    sign_up: Sign up related tests
    sign_in: Sign in related tests
    portfolio: Portfolio related tests
    account_settings: Account settings related tests
    new_user: Tests that create new user accounts
    data_comparison: Data comparison tests between different sources (Dune API vs DeBank)
    dam_extraction: DAM data extraction tests
